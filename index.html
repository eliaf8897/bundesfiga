<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bundesfiga · Asta Fantacalcio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7c3aed;--pk:#ec4899;--b:#3b82f6;--bg:#1b1030;--tx:#f5f3ff;--dim:#c9bfea;--card:#ffffff12;--bd:#ffffff24}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg),#3b1667 50%,#7a1e5c);color:var(--tx);font-family:Inter,system-ui,sans-serif}#app{max-width:960px;margin:auto;padding:18px}h1,h2,h3{font-family:"Baloo 2";margin:0}.hero{text-align:center;padding:25px 0}.hero h1{font-size:42px;background:linear-gradient(90deg,var(--b),var(--pk));-webkit-background-clip:text;color:transparent}.tag{color:var(--dim)}.card,.field,.team{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}.form{display:flex;flex-direction:column;gap:14px}.field label{display:block;color:var(--dim);font-size:12px;font-weight:800;margin-bottom:8px;text-transform:uppercase}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:#0005;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.rules{background:#7c3aed33;border:1px solid var(--bd);border-radius:18px;padding:16px;color:var(--dim)}button{cursor:pointer;border:0;border-radius:999px;padding:10px 16px;font-weight:800}.primary{color:#fff;background:linear-gradient(90deg,var(--p),var(--pk))}.large{width:100%;font-size:16px}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.teams{display:flex;gap:10px;overflow:auto;margin-bottom:14px}.team{min-width:150px;padding:11px}.team.active{border-color:var(--pk);box-shadow:0 0 0 2px #ec489966}.credits{color:#fbcfe8;font-weight:800}.roles{color:var(--dim);font-size:11px;margin-top:4px}.banner{padding:13px 16px;border-radius:18px;background:#3b82f633;border:1px solid var(--bd);margin-bottom:13px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:10px}.tab{background:#ffffff12;color:var(--dim);border:1px solid var(--bd)}.tab.active{background:linear-gradient(90deg,var(--p),var(--pk));color:#fff}.player{display:flex;align-items:center;gap:9px;padding:10px 6px;border-bottom:1px solid var(--bd)}.player:last-child{border:0}.name{flex:1;font-weight:700}.club{color:var(--dim);font-size:12px}.badge{font-size:11px;font-weight:900;padding:4px 7px;border-radius:6px;color:#101020}.P{background:#60a5fa}.D{background:#5eead4}.C{background:#c4b5fd}.A{background:#f9a8d4}.pink{background:var(--pk);color:#fff;border-radius:10px}.playerCard{text-align:center;background:#7c3aed55;border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:14px}.bidgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.bidrow{padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}.leading{border-color:#fbbf24}.controls{display:flex;gap:5px;align-items:center;margin-top:8px;flex-wrap:wrap}.mini{padding:7px 10px;background:#ffffff12;color:#fff;border:1px solid var(--bd)}.bidinput{width:65px;text-align:center}.timer{margin-top:15px}.barbg{height:10px;background:#0005;border-radius:8px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--b),var(--pk))}.summarygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.summarycard{padding:15px}.splayer{display:flex;justify-content:space-between;font-size:13px}.price{color:#fde68a;font-weight:800}@media(max-width:600px){.hero h1{font-size:32px}.header{align-items:flex-start}}
</style>
</head>
<body><div id="app"></div>
<script>
"use strict";
const RULES={P:3,D:8,C:8,A:6},ROLES=["P","D","C","A"],LABEL={P:"Portiere",D:"Difensore",C:"Centrocampista",A:"Attaccante"},START=500;
const DATA=[
["P","Sommer","Inter"],["P","Maignan","Milan"],["P","Di Gregorio","Juventus"],["P","Meret","Napoli"],["P","Svilar","Roma"],["P","Provedel","Lazio"],["P","Carnesecchi","Atalanta"],["P","De Gea","Fiorentina"],
["D","Bastoni","Inter"],["D","Pavard","Inter"],["D","Dumfries","Inter"],["D","Darmian","Inter"],["D","Theo Hernandez","Milan"],["D","Tomori","Milan"],["D","Bremer","Juventus"],["D","Cambiaso","Juventus"],["D","Di Lorenzo","Napoli"],["D","Rrahmani","Napoli"],["D","Mancini","Roma"],["D","Ndicka","Roma"],["D","Romagnoli","Lazio"],["D","Gila","Lazio"],["D","Djimsiti","Atalanta"],["D","Scalvini","Atalanta"],["D","Dodo","Fiorentina"],["D","Beukema","Bologna"],["D","Ricci","Torino"],["D","Bijol","Udinese"],
["C","Calhanoglu","Inter"],["C","Barella","Inter"],["C","Mkhitaryan","Inter"],["C","Frattesi","Inter"],["C","Reijnders","Milan"],["C","Fofana","Milan"],["C","Locatelli","Juventus"],["C","McKennie","Juventus"],["C","Lobotka","Napoli"],["C","Anguissa","Napoli"],["C","McTominay","Napoli"],["C","Pellegrini","Roma"],["C","Koné","Roma"],["C","Rovella","Lazio"],["C","Guendouzi","Lazio"],["C","Ederson","Atalanta"],["C","Pasalic","Atalanta"],["C","Ricci","Torino"],["C","Frendrup","Genoa"],["C","Marin","Cagliari"],
["A","Lautaro Martinez","Inter"],["A","Thuram Marcus","Inter"],["A","Leao","Milan"],["A","Pulisic","Milan"],["A","Vlahovic","Juventus"],["A","Yildiz","Juventus"],["A","Lukaku","Napoli"],["A","Kvaratskhelia","Napoli"],["A","Dybala","Roma"],["A","Dovbyk","Roma"],["A","Castellanos","Lazio"],["A","Zaccagni","Lazio"],["A","Retegui","Atalanta"],["A","Lookman","Atalanta"],["A","Kean","Fiorentina"],["A","Gudmundsson","Fiorentina"],["A","Orsolini","Bologna"],["A","Castro","Bologna"],["A","Zapata","Torino"],["A","Lucca","Udinese"],["A","Pinamonti","Genoa"],["A","Luvumbo","Cagliari"],["A","Colombo","Empoli"],["A","Krstovic","Lecce"],["A","Man","Parma"]
].map((x,i)=>({id:i+1,role:x[0],name:x[1],club:x[2],taken:false}));
let state={phase:"setup",teams:[],players:[],turn:0,nom:null,filter:"ALL",search:""},timer,duration=20;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const total=t=>ROLES.reduce((n,r)=>n+t.roster[r].length,0),slots=t=>25-total(t),max=t=>Math.max(0,t.credits-Math.max(0,slots(t)-1));
function setup(){return `<div class="hero"><h1>🐸 Bundesfiga</h1><p class="tag">L'asta del fantacalcio in stile fantasy league</p></div><form id="setup" class="form"><div class="field"><label>Numero di squadre</label><select id="count">${[2,3,4,5,6,7,8].map(n=>`<option ${n==6?"selected":""}>${n}</option>`).join("")}</select></div><div class="field"><label>Nomi delle squadre</label><div id="names" class="grid">${names(6)}</div></div><div class="field"><label>Durata del rilancio</label><select id="duration"><option>15</option><option selected>20</option><option>30</option><option>45</option></select></div><div class="rules"><h3>Regolamento</h3><ul><li>500 crediti iniziali</li><li>3 P · 8 D · 8 C · 6 A</li><li>Ogni rilancio resetta il timer</li></ul></div><button class="primary large">Inizia l'Asta 🐸</button></form>`}
function names(n){return Array.from({length:n},(_,i)=>`<input name="team${i}" placeholder="Squadra ${i+1}" maxlength="24">`).join("")}
function picker(){let a=state.players.filter(p=>!p.taken&&(state.filter=="ALL"||p.role==state.filter)&&(!state.search||p.name.toLowerCase().includes(state.search)||p.club.toLowerCase().includes(state.search)));return `<div class="banner">🐸 È il turno di <b>${esc(state.teams[state.turn].name)}</b>: chiama un giocatore!</div><div class="tabs">${[["ALL","Tutti"],...ROLES.map(r=>[r,LABEL[r]])].map(x=>`<button type="button" class="tab ${state.filter==x[0]?"active":""}" data-a="filter" data-r="${x[0]}">${x[1]}</button>`).join("")}</div><input id="search" placeholder="Cerca giocatore o squadra..." value="${esc(state.search)}"><div class="card" style="margin-top:12px">${a.length?a.slice(0,100).map(p=>`<div class="player"><span class="badge ${p.role}">${p.role}</span><span class="name">${esc(p.name)}</span><span class="club">${esc(p.club)}</span><button type="button" class="pink" data-a="nom" data-id="${p.id}">Chiama</button></div>`).join(""):"<div class='tag'>Nessun giocatore trovato.</div>"}</div>`}
function auction(){return `<div class="header"><div><h1>🐸 Bundesfiga</h1><span class="tag">Asta in corso</span></div><button class="pink" data-a="end">Termina asta</button></div><div class="teams">${state.teams.map((t,i)=>`<div class="team ${i==state.turn&&!state.nom?"active":""}"><b>${esc(t.name)}</b><div class="credits">${t.credits} cr.</div><div class="roles">${ROLES.map(r=>`${r} ${t.roster[r].length}/${RULES[r]}`).join(" · ")}</div></div>`).join("")}</div>${state.nom?nomination():picker()}`}
function nomination(){let n=state.nom,p=state.players.find(x=>x.id==n.pid),lead=n.bidder&&state.teams.find(t=>t.id==n.bidder);return `<div class="playerCard"><span class="badge ${p.role}">${LABEL[p.role]}</span><h2>${esc(p.name)}</h2><div class="club">${esc(p.club)}</div><p>${n.bid?n.bid+" crediti":"Nessuna offerta"} ${lead?"🏅 "+esc(lead.name):""}</p><div class="timer"><div class="barbg"><div id="bar" class="bar" style="width:${n.time/duration*100}%"></div></div><b id="clock">${n.time}s</b></div></div><div class="bidgrid">${state.teams.map(t=>bidrow(t,p,n)).join("")}</div><div class="card" style="margin-top:14px"><b>Rilanci</b>${n.history.map(h=>`<div class="splayer">${esc(h.name)}<strong>${h.amount}</strong></div>`).join("")||"<div class='tag'>Ancora nessuna offerta.</div>"}</div>`}
function bidrow(t,p,n){let full=t.roster[p.role].length>=RULES[p.role],mn=n.bid+1,cap=max(t),ok=!full&&cap>=mn;return `<div class="bidrow ${n.bidder==t.id?"leading":""}"><b>${esc(t.name)}</b><span class="credits"> · ${t.credits} cr.</span>${ok?`<div class="controls"><button class="mini" data-a="adj" data-t="${t.id}" data-d="-1">−1</button><input class="bidinput" id="b${t.id}" type="number" min="${mn}" max="${cap}" value="${mn}"><button class="mini" data-a="adj" data-t="${t.id}" data-d="1">+1</button><button class="pink" data-a="bid" data-t="${t.id}">Offri</button></div>`:`<div class="tag">${full?"Ruolo completo":"Crediti insufficienti"}</div>`}</div>`}
function summary(){return `<div class="hero"><h1>Riepilogo Asta 🏆</h1></div><div class="summarygrid">${state.teams.map(t=>`<div class="card summarycard"><h3>${esc(t.name)}</h3><p class="tag">Rimasti: ${t.credits} cr.</p>${ROLES.map(r=>`<div><b>${LABEL[r]}</b>${t.roster[r].map(p=>`<div class="splayer"><span>${esc(p.name)}</span><span class="price">${p.price} cr.</span></div>`).join("")||"<div class='tag'>—</div>"}</div>`).join("")}</div>`).join("")}</div><button class="primary large" data-a="new">Nuova Asta</button>`}
function render(){document.getElementById("app").innerHTML=state.phase=="setup"?setup():state.phase=="auction"?auction():summary();if(state.nom)tickDisplay()}
function start(){duration=+document.getElementById("duration").value;let n=+document.getElementById("count").value;state.teams=Array.from({length:n},(_,i)=>({id:i+1,name:document.querySelector(`[name=team${i}]`).value.trim()||`Squadra ${i+1}`,credits:START,roster:{P:[],D:[],C:[],A:[]}}));state.players=DATA.map(p=>({...p,taken:false}));state.turn=0;state.phase="auction";state.nom=null;render()}
function nom(id){if(state.nom)return;state.nom={pid:id,bid:0,bidder:null,time:duration,history:[]};clearInterval(timer);timer=setInterval(()=>{state.nom.time--;tickDisplay();if(state.nom.time<=0){clearInterval(timer);resolve()}},1000);render()}
function bid(id,val){let n=state.nom,t=state.teams.find(x=>x.id==id),p=state.players.find(x=>x.id==n.pid),a=+val;if(!t||!p||a<=n.bid||a>t.credits||a>max(t)||t.roster[p.role].length>=RULES[p.role])return; n.bid=a;n.bidder=id;n.time=duration;n.history.unshift({name:t.name,amount:a});render()}
function resolve(){let n=state.nom,p=state.players.find(x=>x.id==n.pid);if(n.bidder){let t=state.teams.find(x=>x.id==n.bidder);t.credits-=n.bid;t.roster[p.role].push({...p,price:n.bid});p.taken=true}state.nom=null;for(let i=1;i<=state.teams.length;i++){let j=(state.turn+i)%state.teams.length;if(slots(state.teams[j])>0){state.turn=j;break}}if(state.teams.every(t=>slots(t)==0))state.phase="summary";render()}
function tickDisplay(){let b=document.getElementById("bar"),c=document.getElementById("clock");if(b)b.style.width=Math.max(0,state.nom.time/duration*100)+"%";if(c)c.textContent=Math.max(0,state.nom.time)+"s"}
document.addEventListener("submit",e=>{if(e.target.id=="setup"){e.preventDefault();start()}});
document.addEventListener("change",e=>{if(e.target.id=="count"){let n=+e.target.value,old=[...document.querySelectorAll("#names input")].map(x=>x.value);document.getElementById("names").innerHTML=Array.from({length:n},(_,i)=>`<input name="team${i}" placeholder="Squadra ${i+1}" value="${esc(old[i]||"")}">`).join("")}});
document.addEventListener("input",e=>{if(e.target.id=="search"){state.search=e.target.value.toLowerCase();render();document.getElementById("search")?.focus()}});
document.addEventListener("click",e=>{let x=e.target.closest("[data-a]");if(!x)return;let a=x.dataset.a;
if(a=="filter"){state.filter=x.dataset.r;render()}if(a=="nom")nom(+x.dataset.id);
if(a=="adj"){let i=document.getElementById("b"+x.dataset.t);i.value=Math.max(+i.min,Math.min(+i.max,(+i.value||+i.min)+ +x.dataset.d))}
if(a=="bid"){let i=document.getElementById("b"+x.dataset.t);bid(+x.dataset.t,i.value)}
if(a=="end"){clearInterval(timer);state.nom=null;state.phase="summary";render()}if(a=="new"){clearInterval(timer);state={phase:"setup",teams:[],players:[],turn:0,nom:null,filter:"ALL",search:""};render()}});
render();
</script>
</body></html>
